<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhanced Product Cards with Loader</title>
    <style>
      /* ------------------ BODY ------------------ */
      body {
        margin: 0;
        padding: 20px;
        font-family: "Poppins", sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        margin-bottom: 20px;
        color: #222;
        text-align: center;
      }

      /* ------------------ GRID ------------------ */
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      /* ------------------ CARD ------------------ */
      .card {
        width: 260px;
        max-width: 90vw;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        transform-style: preserve-3d;
        perspective: 1000px;
        position: relative;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: scale(1.05);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      .card-inner {
        transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        transform-style: preserve-3d;
      }
      .card:hover .card-inner {
        transform: rotateY(15deg);
      }

      /* ------------------ IMAGE ------------------ */
      .card img {
        width: 100%;
        height: 160px;
        border-radius: 15px;
        object-fit: cover;
        transition: transform 0.5s ease;
      }
      .card:hover img {
        transform: scale(1.1);
      }

      /* ------------------ BADGE ------------------ */
      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #ff5252;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 8px;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.1);
        }
      }

      /* ------------------ HEART ------------------ */
      .heart {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 22px;
        transition: transform 0.3s ease, color 0.3s ease;
        cursor: pointer;
      }
      .heart.active {
        color: #ff5252;
        transform: scale(1.3);
      }

      /* ------------------ TEXT ------------------ */
      .card h3 {
        margin: 12px 0 5px 0;
        font-size: 18px;
        color: #222;
      }
      .price {
        font-size: 20px;
        font-weight: 600;
        color: #111;
        margin-bottom: 8px;
      }

      /* ------------------ COLORS ------------------ */
      .colors {
        display: flex;
        gap: 7px;
        margin-bottom: 10px;
      }
      .color-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #fff;
        transition: transform 0.2s ease;
      }
      .color-dot:hover,
      .color-dot:active {
        transform: scale(1.3);
      }

      /* ------------------ STOCK ------------------ */
      .stock {
        height: 6px;
        background: #ddd;
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 10px;
        position: relative;
      }
      .stock-fill {
        height: 100%;
        width: 70%;
        background: #4caf50;
        transition: width 0.5s ease;
        animation: wave 1.5s infinite linear;
      }
      @keyframes wave {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(2px);
        }
      }

      /* ------------------ TIMER ------------------ */
      .timer {
        font-size: 13px;
        color: #ff5252;
        margin-bottom: 10px;
        transition: color 0.3s ease;
      }

      /* ------------------ BUTTON ------------------ */
      button {
        width: 100%;
        padding: 10px;
        background: #2196f3;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 15px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: background 0.3s ease, transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      button:hover,
      button:active {
        background: #1976d2;
        transform: scale(1.03);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
      button:active::after {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: rgba(255, 255, 255, 0.3);
        top: -50%;
        left: -50%;
        border-radius: 50%;
        animation: ripple 0.6s linear;
      }
      @keyframes ripple {
        from {
          transform: scale(0);
          opacity: 1;
        }
        to {
          transform: scale(1);
          opacity: 0;
        }
      }

      /* ------------------ CONFETTI PARTICLES ------------------ */
      @keyframes fall {
        to {
          transform: translateY(250px);
          opacity: 0;
        }
      }

      /* ------------------ CARD FLIP ------------------ */
      .card.flip .card-inner {
        transform: rotateY(180deg);
      }

      /* ------------------ BRAND MARQUEE ------------------ */
      .brand-marquee {
        width: 100%;
        overflow: hidden;
        margin-top: 40px;
        border-top: 1px solid #ccc;
        padding-top: 20px;
      }
      .marquee-inner {
        display: flex;
        gap: 50px;
        animation: marquee 15s linear infinite;
      }
      .marquee-inner:hover {
        animation-play-state: paused;
      }
      .brand-name {
        font-size: 20px;
        font-weight: 600;
        color: #555;
        cursor: pointer;
        transition: transform 0.3s ease, color 0.3s ease;
      }
      .brand-name:hover {
        transform: scale(1.3);
        color: #2196f3;
      }
      @keyframes marquee {
        0% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(-100%);
        }
      }

      /* ------------------ SCROLL ANIMATION ------------------ */
      @keyframes fadeSlide {
        0% {
          opacity: 0;
          transform: translateY(50px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ------------------ LOADER ------------------ */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .dots {
        display: flex;
        gap: 10px;
      }
      .dots div {
        width: 15px;
        height: 15px;
        background: #2196f3;
        border-radius: 50%;
        animation: bounce 0.6s infinite alternate;
      }
      .dots div:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots div:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        to {
          transform: translateY(-15px);
        }
      }

      /* ------------------ RESPONSIVE ------------------ */
      @media (max-width: 1080px) {
        .card {
          width: 220px;
        }
      }
      @media (max-width: 768px) {
        .card {
          width: 45vw;
        }
      }
      @media (max-width: 480px) {
        .card {
          width: 90vw;
        }
      }
    </style>
  </head>
  <body>
    <h1>Enhanced 3D Product Cards</h1>

    <!-- ------------------ TYPE SELECTOR ------------------ -->
    <div style="margin: 20px">
      <button onclick="loadType('shirt')">Shirts</button>
      <button onclick="loadType('shoes')">Shoes</button>
      <button onclick="loadType('watch')">Watches</button>
    </div>

    <!-- ------------------ LOADER ------------------ -->
    <div id="loader" class="loader">
      <div class="dots">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- ------------------ GRID ------------------ -->
    <div class="grid" id="grid"></div>

    <!-- ------------------ BRAND MARQUEE ------------------ -->
    <div class="brand-marquee">
      <div class="marquee-inner" id="brands"></div>
    </div>

    <script>
      /* ------------------ INITIAL PRODUCT LOAD ------------------ */
      const grid = document.getElementById("grid");
      const brandsContainer = document.getElementById("brands");
      const brands = [
        "Nike",
        "Adidas",
        "Puma",
        "Reebok",
        "Under Armour",
        "New Balance",
        "Asics",
        "Vans",
        "Fila",
        "Converse",
        "Jordan",
        "Skechers",
      ];
      brands.forEach((b) => {
        const brandEl = document.createElement("div");
        brandEl.className = "brand-name";
        brandEl.textContent = b;
        brandsContainer.appendChild(brandEl);
      });

      /* ------------------ HELPER FUNCTIONS ------------------ */
      function addCart() {
        for (let i = 0; i < 15; i++) {
          let c = document.createElement("div");
          c.innerHTML = "🎉";
          c.style.position = "fixed";
          c.style.left = Math.random() * window.innerWidth + "px";
          c.style.top = "-20px";
          c.style.fontSize = "22px";
          c.style.animation = "fall 1s linear";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 1000);
        }
      }
      function confetti(el) {
        for (let i = 0; i < 10; i++) {
          let c = document.createElement("div");
          c.innerHTML = "✨";
          c.style.position = "fixed";
          const rect = el.getBoundingClientRect();
          c.style.left = rect.left + Math.random() * 30 + "px";
          c.style.top = rect.top + Math.random() * 30 + "px";
          c.style.fontSize = "16px";
          c.style.animation = "fall 1s linear";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 1000);
        }
      }

      /* ------------------ LOAD TYPE ------------------ */
      function loadType(type) {
        const loader = document.getElementById("loader");
        loader.style.display = "flex";

        setTimeout(() => {
          grid.innerHTML = "";
          for (let i = 1; i <= 20; i++) {
            const imgURL = `https://source.unsplash.com/260x160/?${type},${i}`;
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
        <div class="card-inner">
          <div class="badge">SALE</div>
          <div class="heart" onclick="this.classList.toggle('active'); confetti(this)">❤️</div>
          <img src="${imgURL}">
          <h3>${type.charAt(0).toUpperCase() + type.slice(1)} ${i}</h3>
          <div class="price">$${(20 + i).toFixed(2)}</div>
          <div class="colors">
            <div class="color-dot" style="background:#cccccc"></div>
            <div class="color-dot" style="background:#ff5252"></div>
            <div class="color-dot" style="background:#2196f3"></div>
          </div>
          <div class="stock"><div class="stock-fill" style="width:70%"></div></div>
          <div class="timer">Offer ends in: 60s</div>
          <button onclick="addCart()">Add to Cart</button>
        </div>
      `;
            grid.appendChild(card);
          }
          loader.style.display = "none";
        }, 1000);
      }

      // Load default type initially
      loadType("shirt");
    </script>
  </body>
</html>
